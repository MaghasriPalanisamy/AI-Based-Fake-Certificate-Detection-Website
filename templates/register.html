<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CertiGuard Pro</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
        }

        .register-box{
            width:420px;
            background:#fff;
            border-radius:15px;
            padding:35px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#1e3c72;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:12px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            background:#1e3c72;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#16325c;
        }

        .login{
            text-align:center;
            margin-top:20px;
        }

        .login a{
            color:#1e3c72;
            text-decoration:none;
            font-weight:bold;
        }

        .flash{
            background:#ffe9b3;
            padding:10px;
            border-radius:6px;
            text-align:center;
            margin-bottom:15px;
        }
    </style>

</head>
<body>

<div class="register-box">

    <h1>Create Account</h1>

    <p>Register to use CertiGuard Pro</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            required>

        <label>Email</label>
        <input
            type="email"
            name="email"
            required>

        <label>Password</label>
        <input
            type="password"
            name="password"
            required>

        <label>Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            required>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login">

        Already have an account?

        <a href="{{ url_for('auth.login') }}">
            Login
        </a>

    </div>

</div>

</body>
</html>
